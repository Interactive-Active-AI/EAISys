name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Verify all URDF interpreters in isolated subprocesses
        run: uv run eaisys verify

      - name: Run unit tests, zero-privilege audits & privacy checks
        run: uv run pytest -v

      - name: Validate frontend syntax
        run: node --check website/app.js
