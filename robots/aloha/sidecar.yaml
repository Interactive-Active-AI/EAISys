robot_id: aloha
control_hz: 15.0
cameras:
  - cam_high
  - cam_left_wrist
  - cam_right_wrist
chains:
  left:
    root_link: left_base_link
    tcp_link: left_ee_tcp
    joints: [left_waist, left_shoulder, left_elbow, left_forearm_roll, left_wrist_angle, left_wrist_rotate]
    home_q: [0.0, -0.3, 0.6, 0.0, 0.5, 0.0]
    end_effector:
      kind: parallel_gripper
      max_width: 0.074
      finger_joints: [left_gripper]
  right:
    root_link: right_base_link
    tcp_link: right_ee_tcp
    joints: [right_waist, right_shoulder, right_elbow, right_forearm_roll, right_wrist_angle, right_wrist_rotate]
    home_q: [0.0, -0.3, 0.6, 0.0, 0.5, 0.0]
    end_effector:
      kind: parallel_gripper
      max_width: 0.074
      finger_joints: [right_gripper]
